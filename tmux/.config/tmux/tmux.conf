# ~/.config/tmux/tmux.conf

# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Reload ---
bind C-r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- Splits (behåll cwd) ---
unbind '"'
unbind %
bind , split-window -h -c "#{pane_current_path}"
bind . split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# --- Pane nav (vim) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Resize ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window/session ---
unbind c
unbind n
unbind r
bind c copy-mode
bind n new-window      -c "#{pane_current_path}"
bind N new-session
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"

# --- Window navigation ---
bind -r Tab next-window
bind -r BTab previous-window

# --- Copy mode (vim + wl-copy) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-ram'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# --- Theme ---
set -g @catppuccin_flavor 'mocha'              # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style 'rounded'  # basic, rounded, slanted, none

# --- Status line ---
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag  status-right "#{E:@catppuccin_status_date_time}"

set -g @catppuccin_window_text           " #{pane_current_command}"
set -g @catppuccin_window_current_text   " #{pane_current_command}"

run '~/.config/tmux/plugins/tpm/tpm'
